<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; width: 1080px; height: 1920px; overflow: hidden; }
  #gl, #hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #hud { z-index: 2; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="gl"></div>
<canvas id="hud" width="1080" height="1920"></canvas>
<script type="module">
  const F = '/node_modules/@fontsource';
  const faces = [
    ['InterSB', `${F}/inter/files/inter-latin-600-normal.woff2`],
    ['InterB', `${F}/inter/files/inter-latin-700-normal.woff2`],
    ['InterXB', `${F}/inter/files/inter-latin-800-normal.woff2`],
    ['Bree Serif', `${F}/bree-serif/files/bree-serif-latin-400-normal.woff2`],
  ];
  for (const [name, url] of faces) { const f = new FontFace(name, `url(${url})`); await f.load(); document.fonts.add(f); }
  window.TL = await (await fetch('/timeline.json')).json();
  await import('/show/scene.js');
</script>
</body></html>
