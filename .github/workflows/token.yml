name: Token - keep Instagram connected
# Instagram tokens last 60 days. This refreshes it every Monday and saves the new one as the IG_ACCESS_TOKEN secret.
# Needs a GH_PAT secret: a fine-grained GitHub token for this repo with "Secrets: read and write".
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh and store
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "Not connected yet (needs the IG_ACCESS_TOKEN and GH_PAT secrets). Skipping."; exit 0; fi
          NEW=$(node src/cli.js refresh-token)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Instagram token refreshed"
