name: Render test - make one episode in the cloud
# Makes one existing episode from scratch (voices, sound, cover, slides, and the reel unless "quick") and attaches the
# files to the run. With "branch" (an episodes/... approval branch) it also saves the files there and puts a held-back
# episode back in the queue. Posts nothing.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Episode folder in content/posts"
        required: true
        default: "003-ninety-two-percent"
      quick:
        description: "Skip the reel (voices, cover and slides only)"
        type: boolean
        default: true
      branch:
        description: "Save the result to this approval branch (e.g. episodes/2026-10-19). Empty = just attach it."
        required: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-models-v1
      - name: Make it
        timeout-minutes: 150
        run: node show/make.js "content/posts/${{ inputs.post }}" ${{ inputs.quick && '--no-reel' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.post }}-test
          path: |
            content/posts/${{ inputs.post }}/reel.mp4
            content/posts/${{ inputs.post }}/cover.jpg
            content/posts/${{ inputs.post }}/slide-*.jpg
            content/posts/${{ inputs.post }}/voice/heard.json
          retention-days: 7
      - name: Save to the approval branch
        if: inputs.branch != '' && !inputs.quick
        env:
          POST: ${{ inputs.post }}
        run: |
          git config user.name "theaicommittee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "const fs=require('fs'),p=require('path');for(const w of fs.readdirSync('content/queue')){const f=p.join('content/queue',w,'plan.json');if(!fs.existsSync(f))continue;const j=JSON.parse(fs.readFileSync(f));let c=0;for(const s of j.slots)if(s.post===process.env.POST&&s.status==='skip'){s.status='made';c=1}if(c)fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')}"
          git add -f content/posts/"$POST"/reel.mp4 content/posts/"$POST"/cover.jpg content/posts/"$POST"/slide-*.jpg content/queue
          git commit -m "Re-rendered $POST" && git push
