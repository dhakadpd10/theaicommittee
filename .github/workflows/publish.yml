name: Publish - post approved posts on time
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish what's due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node src/cli.js publish
      - name: Save status
        run: |
          git config user.name "theaicommittee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/queue
          git diff --cached --quiet || { git commit -m "Publish: status update" && git pull --rebase && git push; }
