name: Check - test the connections
# Read-only: checks the Instagram and Claude keys. Posts nothing, replies to nothing.
on:
  workflow_dispatch:
    inputs:
      debug_comments:
        description: "Also try other ways of reading comments"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code (runs Claude on your subscription)
        run: npm install -g @anthropic-ai/claude-code
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DEBUG_COMMENTS: ${{ inputs.debug_comments && '1' || '' }}
        run: node src/cli.js check
